plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludofriends.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ludofriends.game'
        minSdk 23
        targetSdk 36
        versionCode 32
        versionName "3.2.17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
